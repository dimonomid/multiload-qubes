[package]
name = "multiload-qubes"
version = "0.4.3"
autobins = false
edition = "2021"
license = "GPL-2.0-or-later"
description = "Whole-machine Qubes CPU and memory graphs for the XFCE panel"

[dependencies]
libloading = "0.9"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal"] }
signal-hook = { version = "0.4", default-features = false }

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "multiload-qubes-collector"
path = "src/bin/collector.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
