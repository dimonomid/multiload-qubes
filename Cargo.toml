[package]
name = "multiload-qubes"
version = "0.5.0"
autobins = false
edition = "2021"
license = "GPL-2.0-or-later"
description = "Qubes CPU, memory, network and swap graphs for the XFCE panel"

[dependencies]
multiload-qubes-snapshot = { path = "snapshot" }
libloading = "0.9"
strip-ansi-escapes = "0.2"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal"] }
signal-hook = { version = "0.4", default-features = false }

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "multiload-qubes-collector"
path = "src/bin/collector.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace]
members = ["snapshot"]
resolver = "2"
