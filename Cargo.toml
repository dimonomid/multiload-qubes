[package]
name = "multiload-qubes"
version = "0.1.0"
autobins = false
edition = "2021"
rust-version = "1.88"
license = "GPL-2.0-or-later"
description = "Qubes CPU, memory, network, swap and disk I/O graphs for the XFCE panel"

[dependencies]
multiload-qubes-snapshot = { path = "snapshot" }
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["fs", "process", "signal", "inotify", "poll", "event"] }
signal-hook = { version = "0.4", default-features = false }
gtk = { version = "0.18", optional = true }
glib = { version = "0.18", optional = true }
gio = { version = "0.18", optional = true }
cairo-rs = { version = "0.18", features = ["png"], optional = true }

[lib]
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "multiload-qubes-collector"
path = "src/bin/collector/main.rs"

[[bin]]
name = "multiload-qubes-parser"
path = "src/bin/parser/main.rs"

[[bin]]
name = "multiload-qubes-preview"
path = "src/bin/preview.rs"
required-features = ["panel"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[workspace]
members = ["snapshot"]
resolver = "2"

[features]
panel = ["dep:gtk", "dep:glib", "dep:gio", "dep:cairo-rs", "dep:cbindgen"]

[build-dependencies]
cbindgen = { version = "0.29.4", default-features = false, optional = true }
